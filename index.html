<style>

body{

/* =========================
   HEADER
========================= */

}

.channel-name{

.channel-sub{
    margin-top:12px;
    font-size:13px;
    letter-spacing:3px;
    color:#aaa;
}

/* =========================
   COLOUR ANIMATION
========================= */

@keyframes colourChange{

    0%{
        color:#ff0000;
    }

    14%{
        color:#ff8000;
    }

    28%{
        color:#ffff00;
    }

    42%{
        color:#00ff00;
    }

    56%{
        color:#00ffff;
    }

    70%{
        color:#0080ff;
    }

    84%{
        color:#a000ff;
    }

    100%{
        color:#ff0000;
    }

}

/* =========================
   MAIN CONTAINER
========================= */

.container{
    width:94%;
    max-width:650px;
    margin:auto;
}

/* =========================
   DOWNLOAD CATEGORY
========================= */

.main-heading{

}

.main-heading .line{

}

/* =========================
   CATEGORY TITLE
========================= */

.category-title{
    margin:20px 0 15px;
    padding:12px 15px;
    border-left:4px solid white;
    background:#111;
    font-size:19px;
    font-weight:900;
    letter-spacing:2px;
    animation:colourChange 10s linear infinite;
}

/* =========================
   BUSSID CATEGORY
========================= */

.category{
    margin-bottom:13px;
}

.category button{
    width:100%;
    padding:18px 16px;
    background:#101010;
    border:1px solid #292929;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:800;
    text-align:left;
    cursor:pointer;
    position:relative;
    transition:0.3s;
}

.category button::after{
    content:"+";
    position:absolute;
    right:18px;
    font-size:23px;
    top:14px;
}

.category button:hover{
    background:#181818;
}

.category button.active::after{
    content:"−";
}

/* =========================
   VERSION AREA
========================= */

.content{
    display:none;
    background:#0b0b0b;
    border:1px solid #222;
    border-top:none;
    border-radius:0 0 12px 12px;
    padding:15px;
}

.version-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px;
    margin:5px 0;
    background:#111;
    border:1px solid #292929;
    border-radius:9px;
}

.version{
    font-size:15px;
    font-weight:bold;
    animation:colourChange 10s linear infinite;
}

.download{
    display:inline-block;
    padding:9px 15px;
    background:#050505;
    border:1px solid #444;
    border-radius:7px;
    color:white;
    text-decoration:none;
    font-size:13px;
    font-weight:900;
    animation:colourChange 10s linear infinite;
}

/* =========================
   LATEST LIVERY
========================= */

    margin:45px auto 20px;

.video{

.video iframe{

.livery-name{

.file-size{

.livery-download{

/* =========================

/* =========================

/* NO GLOW */

<script>

function toggleCategory(button){

    const currentContent = button.nextElementSibling;

    const allContents = document.querySelectorAll(".content");

    const allButtons = document.querySelectorAll(".category button");

    allContents.forEach(function(content){

        if(content !== currentContent){
            content.style.display = "none";
        }

    });

    allButtons.forEach(function(btn){

        if(btn !== button){
            btn.classList.remove("active");
        }

    });


    if(currentContent.style.display === "block"){

        currentContent.style.display = "none";

        button.classList.remove("active");

    }
    else{

        currentContent.style.display = "block";

        button.classList.add("active");

    }

}

</script>
